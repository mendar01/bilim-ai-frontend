<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
<!-- Было: Bilim AI Hub -->
<div class="brand__title">Oi genius</div>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="bg-grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand__text">
          <div class="brand__title">Bilim AI Hub</div>
          <div class="brand__sub" id="subtitle"></div>
        </div>
      </div>

      <div class="top-actions">
        <div class="lang" role="tablist" aria-label="Language">
          <button class="lang__btn" id="langKz" type="button">KZ</button>
          <button class="lang__btn" id="langRu" type="button">RU</button>
          <span class="lang__pill" id="langPill" aria-hidden="true"></span>
        </div>
<span class="badge" id="scoreBadge">Ұпай: <b id="scoreValue">0</b></span>
        <button class="btn btn--ghost" id="showTips" type="button"></button>
        <button class="btn btn--danger" id="clearChat" type="button"></button>
      </div>
    </div>
  </header>

  <main class="container layout">
    <!-- LEFT -->
    <aside class="side">
      <section class="card">
        <div class="card__head">
          <h2 id="settingsTitle"></h2>
          <span class="badge"><span class="dot"></span><span id="statusText"></span></span>
        </div>

        <div class="card__body">
          <div class="field">
            <label for="role" id="roleLabel"></label>
            <select id="role">
              <option value="Оқушы">Оқушы</option>
              <option value="Студент">Студент</option>
              <option value="Мұғалім">Мұғалім</option>
            </select>
          </div>

          <div class="field">
            <label for="subject" id="subjectLabel"></label>
            <select id="subject">
              <option value="Жалпы">Жалпы</option>
              <option value="Қазақ тілі">Қазақ тілі</option>
              <option value="Математика">Математика</option>
              <option value="Қазақстан тарихы">Қазақстан тарихы</option>
              <option value="Физика">Физика</option>
              <option value="Информатика">Информатика</option>
              <option value="Ағылшын тілі">Ағылшын тілі</option>
            </select>
          </div>

          <div class="field">
            <label for="mode" id="modeLabel"></label>
            <select id="mode">
              <option value="explain" id="modeExplainOpt"></option>
              <option value="check" id="modeCheckOpt"></option>
            </select>
          </div>

          <div class="notice" id="noticeText"></div>
        </div>
      </section>

      <section class="card">
        <div class="card__head">
          <h2 id="promptsTitle"></h2>
          <span class="tag" id="promptsTag"></span>
        </div>
        <div class="card__body">
          <div class="chips" id="chips"></div>
        </div>
      </section>
    </aside>

    <!-- RIGHT -->
    <section class="card chat">
      <div class="chat__head">
        <div>
          <h2 id="chatTitle"></h2>
          <div class="chat__sub" id="chatSub"></div>
        </div>
        <span class="tag" id="hintTag"></span>
      </div>

      <div class="chat__box" id="chatBox"></div>

      <div class="chat__foot">
        <textarea id="message" class="chat__input" rows="2"></textarea>
        <button class="btn btn--primary" id="sendBtn" type="button"></button>
      </div>
      <div class="helper" id="helperText"></div>
    </section>
  </main>

  <div class="toast" id="toast">
    <div class="toast__title" id="toastTitle"></div>
    <div class="toast__text" id="toastText"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
